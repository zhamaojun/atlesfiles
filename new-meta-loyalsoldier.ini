[custom]
; ==========================================================================
;  OpenClash 分流配置 —— Loyalsoldier/clash-rules 打底 + GEOSITE 应用级分流
;
;  设计原则（自上而下优先级，顺序即优先级，改动前请务必理解分层）：
;    L1 内网 / 必须直连的软件      —— 最高优先级，绝不能被后面抢走
;    L2 广告拦截
;    L3 自定义直连补丁            —— 修补国内服务用海外域名的情况
;    L4 国内域名总闸（窄）         —— 只放必须在应用组之前直连的
;    L5 应用级分流                —— 你的 20+ 策略组，核心区域
;    L6 代理大列表（proxy / gfw）  —— 兜底代理，必须在 L5 之后
;    L7 直连大列表（direct/cncidr）—— 兜底直连
;    L8 FINAL
;
;  关键改动（相对原配置）：
;    1. Aethersailor 代理补丁从第 3 位移到 L6，不再抢应用组流量【最重要】
;    2. []GEOSITE,gfw 换成 Loyalsoldier gfw.txt，去掉对特定 geosite.dat 的依赖
;    3. 删除不存在的 GeoIP 分类（Notion / adobe / teamviewer / github）
;    4. Telegram 的 IP 段用 telegramcidr.txt，比 []GEOIP,telegram 更可靠
;    5. 新增广告拦截（reject.txt）+ applications.txt 软件直连白名单
;    6. url-test 容差 50ms → 150ms，间隔 300s → 600s，减少节点抖动
;    7. ♻️ 自动选择 改为在五大区域组之间测速，不再纳入冷门/高倍率节点
;    8. 合并功能重复的 🚀 手动选择 与 🧭 手动选择，代理兜底统一走 🌐 Default
;    9. AI 拆分为 🤖 ChatGPT / 🧡 Claude / ♊ Gemini / 🛸 Grok / 🧠 AI 五个组，
;       并处理 Gemini→Google、Grok→X 的规则顺序冲突
; ==========================================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================================
;  节点清洗
;  说明：新增了「倍率 / 高倍 / 按量」等关键词，避免自动选择测到高倍率节点。
;       如果你需要回国节点，不要加 回国|中国|CN 之类的词。
; ==========================================================================
exclude=流量|套餐|到期|剩余|重置|过期|官网|网站|最新网址|发布页|防失联|失联|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|邀请|返利|倍率|高倍|按量|中转说明|Expire|Traffic|Reset|Remaining|Official|Website|Invite


; ==========================================================================
;  L1 内网 / 必须直连（最高优先级）
; ==========================================================================
; 需要直连的常见软件（QQ、微信、网易云等，classical 格式）
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt,86400
; 路由器管理后台、内网保留域名
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt,86400
; 局域网与保留 IP
ruleset=DIRECT,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt,86400
ruleset=DIRECT,[]GEOIP,private,no-resolve


; ==========================================================================
;  L2 广告拦截
;  对应策略组 🛡️ 广告拦截，可在面板一键切 REJECT / DIRECT
;  如果发现某些 App 白屏、支付页打不开，先把这个组切到 DIRECT 排查
; ==========================================================================
ruleset=🛡️ 广告拦截,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt,86400


; ==========================================================================
;  L3 自定义直连补丁（Aethersailor）
;  修补"国内服务用海外域名"导致误代理的情况，Loyalsoldier direct.txt 覆盖不到
; ==========================================================================
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800


; ==========================================================================
;  L4 国内域名总闸（必须在应用组之前）
;  说明：这几条放在应用组之前是刻意的——
;        google-cn 让 google.cn 系直连，不进 🔎 Google 组
;        GEOSITE,cn 让 apple-cn / microsoft-cn / 微信QQ 等直连，
;        应用组只处理"海外那部分域名"。这也是你原配置的行为，保持不变。
; ==========================================================================
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker
ruleset=DIRECT,[]GEOSITE,cn


; ==========================================================================
;  L5 应用级分流
;
;  【重要】这里仍然用 GEOSITE，因为 Loyalsoldier 没有应用级列表。
;  如何验证某条 GEOSITE 是否真的生效：
;    OpenClash 面板 → 连接（Connections）→ 看目标域名那一行的「规则」列，
;    会显示实际命中的规则名。如果本该走 OKX 的域名显示的是 Match/GeoSite,cn，
;    说明这个 GEOSITE 分类不存在或被前面的规则抢走了。
;
;  如果某个应用的 GEOSITE 分类不存在（交易所类最常见），
;  改用 blackmatrix7 的列表替代：先去
;    https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Clash
;  确认目录名，然后按下面 Netflix 的格式写（注意目录名和文件名要一致）：
;    ruleset=🟦 OKX,clash-classic:https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OKX/OKX.yaml,86400
;  换成 blackmatrix7 之后，记得把对应的 []GEOSITE 那行删掉或注释掉。
; ==========================================================================

; --- Adobe（可一键 REJECT 断网）---
ruleset=🟥 Adobe,[]GEOSITE,adobe

; --- 生产力 ---
ruleset=📦 Notion,[]GEOSITE,notion

; --- 通讯：Telegram 域名 + 官方 IP 段 ---
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt,86400

; ==========================================================================
;  AI 服务（细分）
;
;  【顺序陷阱，改动前必读】
;   1. Gemini 的域名全在 google.com 之下（gemini.google.com、aistudio.google.com
;      等），所以 Gemini 必须排在下面的 🔎 Google 规则之前，否则会被 Google 组吃掉。
;   2. Grok 的 grok.x.com 属于 x.com，会被 GEOSITE,twitter 匹配，
;      所以 Grok 必须排在下面的 🐦 X 规则之前。
;   3. 🧠 AI 用的 category-ai-!cn 是"所有海外 AI"的大分类，
;      必须放在四个具体服务的最后，否则它会把 ChatGPT / Claude 全部抢走。
;
;  【为什么有 GEOSITE 还写明文域名】
;   GEOSITE 依赖 OpenClash 本地的 geosite.dat 版本。
;   anthropic / openai / google-gemini 是老分类，基本都有；
;   xai（Grok）是近期才加入 domain-list-community 的，旧数据库里没有，
;   所以 Grok 额外写了明文域名兜底。明文规则不依赖任何数据库，永远生效。
;   如果你发现 Claude / Gemini 也没命中（连接页规则列不显示对应组），
;   把它们下面注释掉的明文规则取消注释即可。
; ==========================================================================

; --- ChatGPT / OpenAI ---
ruleset=🤖 ChatGPT,[]GEOSITE,openai
; 明文兜底（geosite 里 openai 分类失效时取消注释）
; ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,openai.com
; ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,chatgpt.com
; ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,oaistatic.com
; ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,oaiusercontent.com
; ruleset=🤖 ChatGPT,[]DOMAIN-SUFFIX,sora.com

; --- Claude / Anthropic ---
ruleset=🧡 Claude,[]GEOSITE,anthropic
; 明文兜底
; ruleset=🧡 Claude,[]DOMAIN-SUFFIX,claude.ai
; ruleset=🧡 Claude,[]DOMAIN-SUFFIX,claude.com
; ruleset=🧡 Claude,[]DOMAIN-SUFFIX,anthropic.com
; ruleset=🧡 Claude,[]DOMAIN-SUFFIX,claudeusercontent.com

; --- Gemini / Google AI（必须在 🔎 Google 之前）---
ruleset=♊ Gemini,[]GEOSITE,google-gemini
; 明文兜底（覆盖 Gemini 网页版、AI Studio、NotebookLM、Jules、Labs）
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,gemini.google.com
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,aistudio.google.com
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,notebooklm.google.com
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,deepmind.google
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,jules.google
; ruleset=♊ Gemini,[]DOMAIN-SUFFIX,labs.google
; ruleset=♊ Gemini,[]DOMAIN,ai.google.dev

; --- Grok / xAI（必须在 🐦 X 之前）---
; xai 是较新的 geosite 分类，旧 geosite.dat 里可能不存在，
; 因此明文规则默认全部启用，不要注释掉。
ruleset=🛸 Grok,[]GEOSITE,xai
ruleset=🛸 Grok,[]DOMAIN-SUFFIX,grok.com
ruleset=🛸 Grok,[]DOMAIN-SUFFIX,x.ai
ruleset=🛸 Grok,[]DOMAIN-SUFFIX,grokipedia.com
ruleset=🛸 Grok,[]DOMAIN,grok.x.com

; --- 其他 AI 服务总集（Perplexity / Copilot / HuggingFace / Midjourney 等）---
;     必须放在上面四个具体服务之后
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

; --- Apple ---
ruleset=🍎 Apple,[]GEOSITE,apple

; --- 流媒体 ---
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🎵 TikTok,[]GEOSITE,tiktok

; --- 社交 ---
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=↔️ teamviewer,[]GEOSITE,teamviewer

; --- 交易所 ---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

; --- 大厂（放在应用组末尾，避免抢走上面更具体的规则）---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ cloudflare,[]GEOIP,cloudflare,no-resolve
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve
ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- 泛分类（最宽，必须在具体应用之后）---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn


; ==========================================================================
;  L6 代理兜底列表（必须在 L5 之后！这是原配置最大的问题所在）
; ==========================================================================
; Loyalsoldier 代理域名总表
ruleset=🌐 Default,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt,86400
; GFWList 域名（替代原来的 []GEOSITE,gfw，不再依赖特定 geosite.dat）
ruleset=🌐 Default,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt,86400
; Aethersailor 代理补丁 —— 现在才是真正的"兜底、不越权"
ruleset=🌐 Default,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🌐 Default,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; 【可选，较激进】非中国大陆顶级域名全部代理。
; 打开后 .jp .kr .tw 等全走代理，误伤率不低，默认注释掉。
; ruleset=🌐 Default,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt,86400


; ==========================================================================
;  L7 直连兜底列表
; ==========================================================================
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt,86400
ruleset=DIRECT,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt,86400
ruleset=DIRECT,[]GEOIP,cn,no-resolve


; ==========================================================================
;  L8 非标端口 + FINAL
; ==========================================================================
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================================
;  应用策略组（UI 主入口）
; ==========================================================================
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT`[]DIRECT

custom_proxy_group=📦 Notion`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default
