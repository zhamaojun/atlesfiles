; ==========================================================================
;  出口 / 兜底组
;  说明：原配置的 🚀 手动选择 与 🧭 手动选择 功能重复，容易误操作，已合并。
;        所有需要代理的兜底流量统一走 🌐 Default，一个开关控全局。
; ==========================================================================
custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🧭 手动选择
custom_proxy_group=🔀 非标端口`select`[]DIRECT`[]🐟 漏网之鱼`[]🌐 Default


; ==========================================================================
;  节点池 / 测速组
;
;  参数格式：interval[,timeout],tolerance
;  600,,150  = 每 10 分钟测一次，新节点必须快 150ms 才切换。
;  原来的 300,,50 会导致节点频繁抖动、长连接被打断，是"不稳定"的常见来源。
;
;  如果你更在意连接稳定而不是延迟最低，把下面 5 个区域组的 url-test
;  改成 fallback（只在当前节点挂掉时才切换）：
;    custom_proxy_group=🇭🇰 HK`fallback`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300
; ==========================================================================
custom_proxy_group=🧭 手动选择`select`.*

; 自动选择：在五大区域的最优节点之间比较，不再纳入冷门 / 高倍率节点
custom_proxy_group=♻️ 自动选择`url-test`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`http://www.gstatic.com/generate_204`600,,150

custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`600,,150
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`600,,150
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`600,,150
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|狮城|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`600,,150
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`600,,150

; 冷门节点池（排除五大区域），手动选择
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|狮城|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*
