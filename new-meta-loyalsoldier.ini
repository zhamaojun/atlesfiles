; HK 出口经常出现「不可用地区」「Unable to verify」。
custom_proxy_group=🤖 ChatGPT`select`[]🇺🇸 US`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇭🇰 HK`[]🧊 冷门节点`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
